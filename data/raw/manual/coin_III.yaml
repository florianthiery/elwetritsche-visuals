# Semantics-detail page content for Coin III -- "The Guardian" (ELW-03).
#
# Card and terminology-graph content drawn from
# elwetritsch_coin_series_metadata_v3.md (Coin III) / data/raw/manual/
# series_metadata.yaml, following the pattern established for Coin I
# (data/raw/manual/coin_I.yaml). The reverse motif's real-world depicts
# target is Trifels Castle -- the real, famous hilltop castle actually
# standing at Annweiler am Trifels, so the fictional "fortified hilltop
# castle" reverse motif gets a real depicts target rather than a generic
# one (PRIMER.md A1 Befund, 2026-09-22).
#
# Real-world identifier (Wikidata QID) for this coin, beyond the ones
# already used for Coin I, resolved by web search against wikidata.org:
# Trifels Castle wd:Q559202.
#
# Site vs. findspot split into two cards + a seventh graph relation
# (2026-09-22, user-requested) -- see coin_I.yaml's header for the
# rationale; applied identically here.

coin_id: "III"
elw_id: "ELW-03"
title: "The Guardian"
site_key: "annweiler_am_trifels"            # key into manual/sites.yaml
findspot_fictional: 'Hoard 7, vineyard margin "Am Sonnenberg"'
obverse_image: "III_obverse.png"             # relative to data/raw/coins/images/
reverse_image: "III_reverse.png"

cards:
  - label: "Material"
    value: "Electrum (Au–Ag alloy)"
    notes:
      - "fictional, styled on archaic"
      - "electrum coinage"
    chips: ["wd:Q239481"]

  - label: "Motif (obverse)"
    value: "Elwetritsch with spear and grapevine shield"
    notes:
      - "Palatine folk creature, shown here"
      - "as an armed guardian"
    chips: ["wd:Q142294"]

  - label: "Motif (reverse)"
    value: "Hilltop castle with grapevine"
    notes:
      - "fictional reverse motif,"
      - "real castle above the findspot (Trifels)"
    chips: ["wd:Q559202", "wd:Q1422342"]

  - label: "Site"
    value: "Annweiler am Trifels, Palatinate"
    notes:
      - "real modern municipality,"
      - "Südliche Weinstraße vineyard margin"
    chips: ["wd:Q22953", "geonames:2955951"]

  - label: "Find spot (fictional)"
    value: 'Hoard 7, "Am Sonnenberg"'
    notes:
      - "invented find context —"
      - "no real external identifier"
    chips: []

  - label: "Metallurgical analysis"
    value: "Au ≈43% · Ag ≈55% · Cu ≈2%"
    notes:
      - "freely invented — not a real"
      - "measurement"
    chips: []
    caption: "cf. real published range: ≈42–48% Au"

