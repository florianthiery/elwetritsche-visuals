# Real, verifiable identifiers for the eleven modern Palatinate municipalities
# the fictional Elwetritsch stater series is nominally "found near" (see
# ../coins/elwetritsch_coin_series_metadata_v3.md, section "Compact overview").
#
# Resolved by hand via web search against wikidata.org and geonames.org
# (no direct API access from the sandbox this was compiled in -- see
# PRIMER.md A1 Befunde, 2026-09-22). Coordinates are town-centre positions,
# not excavation coordinates: the series' own metadata says coordinates are
# omitted because the archaeological findspots are fictional (see
# elwetritsch_coin_series_metadata_v3.md, "Shared classification").
#
# wikidata / geonames: identifiers only, no full URLs (house convention --
# expand as https://www.wikidata.org/wiki/<qid> / https://www.geonames.org/<id>).

