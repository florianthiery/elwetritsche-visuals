# Semantics-detail page content for Coin I -- "The Reveller" (ELW-01).
#
# Card and terminology-graph content transcribed from the hand-built pilot
# graphic this repo's first step is reproducing programmatically
# (data/raw/reference/I_semantics_detail.png, itself the last of several
# manually iterated versions agreed in an earlier chat -- see PRIMER.md A1).
#
# One correction against that reference: the terminology-graph node for
# "P45 consists of" read "Electron" there (a typo carried over from an
# earlier iteration); it is "Electrum" here, matching the Material card and
# the wd:Q239481 target, which is indeed Electrum, not the subatomic
# particle (PRIMER A1 Befund, 2026-09-22).
#
# Source facts (material, motifs, find context) are from
# elwetritsch_coin_series_metadata_v3.md, Coin I. Metallurgical analysis
# figures are explicitly invented (see that file's header); the "real
# published range" comparison is general numismatic literature on archaic
# electrum coinage, not a measurement of this (fictional) coin.

coin_id: "I"
elw_id: "ELW-01"
title: "The Reveller"
site_key: "edenkoben"                       # key into manual/sites.yaml
findspot_fictional: 'Hoard 3, vineyard terrace "Im Letten"'
obverse_image: "I_obverse.png"               # relative to data/raw/coins/images/
reverse_image: "I_reverse.png"

cards:
  - label: "Material"
    value: "Electrum (Au–Ag alloy)"
    notes:
      - "fictional, styled on archaic"
      - "electrum coinage"
    chips: ["wd:Q239481"]

  - label: "Motif (obverse)"
    value: "Elwetritsch wearing a horned helmet"
    notes:
      - "Palatine folk creature, used here"
      - "humorously as the coin type"
    chips: ["wd:Q142294"]

  - label: "Motif (reverse)"
    value: "Grapevine with leaves and a Dubbeglas"
    notes:
      - "fictional reverse motif,"
      - "Palatinate viticulture imagery"
    chips: ["wd:Q22553", "wd:Q1422342"]

  - label: "Find spot (fictional)"
    value: "near Edenkoben, Palatinate"
    notes:
      - "invented find context,"
      - "Südliche Weinstraße wine region"
    chips: ["wd:Q537985", "geonames:2933410"]

  - label: "Metallurgical analysis"
    value: "Au ≈45% · Ag ≈53% · Cu ≈2%"
    notes:
      - "freely invented — not a real"
      - "measurement"
    chips: []
    caption: "cf. real published range: ≈42–48% Au"

# The terminology graph: a vertical spine from the coin (as an E22
# Human-Made Object instance) to the CIDOC-CRM classes, vocabulary terms
# and real-world entities it is linked to. ``category`` selects the node
# colour from elwetritsche_visuals_utils (REAL / CLASS / TERM).
terminology_graph:
  root:
    label: "Elwetritsch stater"
    subtitle: "(fictional coin)"
    category: "REAL"
  relations:
    - property: "P45 consists of"
      property_uri: "http://www.cidoc-crm.org/cidoc-crm/P45_consists_of"
      target_label: "Electrum"
      target_subtitle: "wd:Q239481"
      category: "TERM"
    - property: "P2 has type"
      property_uri: "http://www.cidoc-crm.org/cidoc-crm/P2_has_type"
      target_label: "E22 Human-Made Object"
      target_subtitle: "cidoc-crm.org/cidoc-crm/E22_Human-Made_Object"
      category: "CLASS"
    - property: "P2 has type"
      property_uri: "http://www.cidoc-crm.org/cidoc-crm/P2_has_type"
      target_label: "Coin"
      target_subtitle: "wd:Q41207 · aat:300037222"
      category: "TERM"
    - property: "P62 depicts"
      property_uri: "http://www.cidoc-crm.org/cidoc-crm/P62_depicts"
      target_label: "Dubbeglas (wine glass)"
      target_subtitle: "wd:Q22553"
      category: "TERM"
    - property: "P53 has former or current location"
      property_uri: "http://www.cidoc-crm.org/cidoc-crm/P53_has_former_or_current_location"
      target_label: "near Edenkoben (Palatinate)"
      target_subtitle: "wd:Q537985"
      category: "TERM"
    - property: "P62 depicts"
      property_uri: "http://www.cidoc-crm.org/cidoc-crm/P62_depicts"
      target_label: "Elwetritsch (creature)"
      target_subtitle: "wd:Q142294"
      category: "TERM"
