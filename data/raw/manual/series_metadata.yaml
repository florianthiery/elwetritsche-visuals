# From the source markdown's "Suggested graph properties" section. Mirrors,
# in general terms, the per-coin `terminology_graph.relations` authored by
# hand in data/raw/manual/coin_<ID>.yaml -- kept here too because it is
# useful on its own as a legend for any new coin's terminology graph.
suggested_graph_properties:
  - property: "P45 consists of"
    target: "Electrum"
  - property: "P2 has type"
    target: "E22 Human-Made Object"
  - property: "P2 has type"
    target: "Coin"
  - property: "P62 depicts"
    target: "concepts described by the obverse/reverse motifs"
  - property: "P53 has former or current location"
    target: "modern municipality / site"
  - property: "findspot"
    target: "separate fictional archaeological findspot"
  - property: "metallurgical analysis"
    target: "fictional measurement/result, explicitly labelled as invented"
