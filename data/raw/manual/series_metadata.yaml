# Structured, machine-readable transcription of every field in
# ../coins/elwetritsch_coin_series_metadata_v3.md (the prose source for
# all eleven fictional Elwetritsch staters), so that later visualisation
# steps can read one coin's data with a plain YAML load instead of
# re-parsing the markdown. Transcribed by hand against that file, values
# unchanged (PRIMER.md A1 Befund, 2026-09-22).
#
# Not a replacement for data/raw/manual/coin_<ID>.yaml: those files hold
# the *curated* card/terminology-graph copy for the semantics-detail page
# (step_semantics_detail.py) and may phrase things more compactly for that
# layout. This file holds the *complete* per-coin prose fields as the
# source markdown states them, for figures that need more of that prose
# (the planned overview map, for instance) without going back to the .md.
#
# `site_key` is the key into sites.yaml for the coin's real modern
# municipality; the eleven keys here are in the same I-XI order as
# sites.yaml itself. `composition_pct` parses the "Au ~X%, Ag ~Y%, Cu ~Z%"
# figures given in the source (all marked there as approximate/fictional,
# hence "~", not "="). `prompt_obverse` / `prompt_reverse` split the
# source's single "Prompt:" field on its "|" separator.

shared:
  object_type: "Coin"
  cidoc_crm_class: "E22 Human-Made Object"
  material: "Electrum (Au–Ag alloy)"
  series: "Elwetritsch staters (fictional coin series)"
  setting: "Palatinate (Pfalz), present-day Rhineland-Palatinate, Germany"
  period: "Archaic-style fictional issue, ca. 6th–5th century BCE"
  concept: "Archaic coin aesthetics deliberately combined with anachronistic Palatinate folklore and regional motifs."
  coordinates_note: "Omitted because all archaeological findspots are fictional."
  base_visual_prompt: >-
    Irregular ancient electrum flan, warm light-gold tone, subtly hammered
    and weathered surface with fine cracks, simple raised relief, humorous
    strongly stylised long-beaked Elwetritsch with large round eyes,
    restrained archaic/folk-art detail, frontal numismatic presentation on
    a clean white background, no lettering or coin number on the coin.
    Obverse: uncluttered figure with a few clear attributes. Reverse:
    compact motif inside a recessed square incuse. Keep the visual
    language consistent with Coins I–X.
  real_vs_fictional_note: >-
    For presentation and graph visualisation, distinguish real
    terminology/geographical entities (e.g. Electrum, Coin, Speyer, Dahn,
    Limburgerhof) from fictional research objects and archaeological
    contexts (ELW-01–11 and their findspots).

